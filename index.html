<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คนขับออนไลน์</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
  #map{position:absolute;inset:0}
  #bar{position:absolute;z-index:1000;top:10px;left:10px;right:10px;display:flex;gap:8px;pointer-events:none}
  .pill{pointer-events:auto;flex:1;max-width:160px;padding:10px 14px;border-radius:14px;color:#fff;font-weight:600;
        box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;justify-content:space-between;align-items:baseline}
  .pill b{font-size:26px}
  #free{background:#16a34a}#busy{background:#ea7a0c}
  #status{position:absolute;z-index:1000;bottom:8px;left:10px;font-size:12px;background:#fffc;padding:3px 8px;border-radius:8px}
  #tg{position:absolute;z-index:1000;bottom:34px;left:10px;right:10px;padding:18px;border:0;border-radius:16px;
      font:600 18px system-ui,"Noto Sans Thai",sans-serif;color:#fff;background:#16a34a;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #tg.busy{background:#ea7a0c}
  .zone{background:#fffe;border-radius:10px;padding:4px 8px;text-align:center;font:600 12px system-ui,'Noto Sans Thai',sans-serif;box-shadow:0 1px 5px #0005;position:absolute;left:0;top:0;width:max-content;transform:translate(-50%,-50%)}
  .zone .zn{color:#3f3f46;font-weight:500}.zone .g{color:#16a34a;margin-right:8px}.zone .o{color:#ea7a0c}
  #gate{position:fixed;inset:0;z-index:3000;background:#18181b;color:#fff;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;font-family:system-ui,"Noto Sans Thai",sans-serif}
  #gate h2{margin:0;font-size:22px}#gate p{margin:0;color:#a1a1aa;max-width:320px;line-height:1.5}
  #gate button{border:0;border-radius:14px;padding:16px 24px;font:600 18px inherit;background:#16a34a;color:#fff}
  #me{max-width:calc(100% - 20px);position:absolute;z-index:1000;top:80px;left:10px;font-size:13px;background:#fffd;padding:3px 9px;border-radius:8px}
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <div class="pill" id="free"><span>ว่าง</span><b id="nf">0</b></div>
  <div class="pill" id="busy"><span>รับงานอยู่</span><b id="nb">0</b></div>
</div>
<button id="tg" style="display:none">สถานะของฉัน: ว่าง (แตะเพื่อเปลี่ยน)</button>
<div id="gate">
  <h2>แชร์ตำแหน่งก่อนดูข้อมูล</h2>
  <p>ต้องแชร์ตำแหน่งของคุณให้ระบบรู้ว่าอยู่โซนไหนก่อน จึงจะเห็นจำนวนคนขับว่าง/รับงานในแต่ละโซนได้ ข้อมูลของคุณจะแสดงเป็นจำนวนในโซนเท่านั้น ไม่มีชื่อ</p>
  <button id="gobtn">แชร์ตำแหน่งแล้วเข้าดู</button>
  <p id="gerr" style="color:#fca5a5"></p>
</div>
<div id="me" style="display:none"></div>
<div id="status">กำลังโหลด…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ====== แก้ 2 บรรทัดนี้ ======
const DB_URL = "https://koh-drivers-map-default-rtdb.asia-southeast1.firebasedatabase.app";
const SECRET = "";
// =============================
const OFFLINE_MS = 10 * 60 * 1000;  // เกิน 10 นาที = ออฟไลน์

const map = L.map("map", {zoomSnap: 0.25}).fitBounds([[9.66, 99.94], [9.81, 100.09]], {padding: [24, 24]});
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom: 19, attribution: "© OpenStreetMap"}).addTo(map);

const layer = L.layerGroup().addTo(map);
const ZONES = [
  {name: "ทองศาลา", lat: 9.718, lon: 99.984},
  {name: "หินกอง", lat: 9.742, lon: 99.977},
  {name: "มะเดื่อหวาน", lat: 9.749, lon: 100.005},
  {name: "ศรีธนู/หาดยาว", lat: 9.758, lon: 99.964},
  {name: "โฉลกหลำ/แม่หาด", lat: 9.790, lon: 100.005},
  {name: "บ้านใต้", lat: 9.708, lon: 100.018},
  {name: "หาดริ้น", lat: 9.680, lon: 100.062},
  {name: "ทองนาง/ฝั่งตะวันออก", lat: 9.750, lon: 100.052}
];
const ZONE_MAX_KM = 3;
function nearestZone(lat, lon) {
  let best = null, bd = ZONE_MAX_KM;
  for (const z of ZONES) {
    const dy = (z.lat - lat) * 111.2, dx = (z.lon - lon) * 111.2 * Math.cos(lat * Math.PI / 180);
    const d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = z; }
  }
  return best;
}
let fitted = false;

let unlocked = false;
let store = {}, es = null;
function applyChange(path, data, merge) {
  const parts = path.split("/").filter(Boolean);
  if (!parts.length) { store = merge ? Object.assign(store, data || {}) : (data || {}); return; }
  let o = store;
  for (let i = 0; i < parts.length - 1; i++) { o = o[parts[i]] = o[parts[i]] || {}; }
  const k = parts[parts.length - 1];
  if (data === null) delete o[k];
  else if (merge && typeof data === "object") o[k] = Object.assign(o[k] || {}, data);
  else o[k] = data;
}
function connect() {
  if (es) return;
  es = new EventSource(DB_URL + "/drivers.json" + (SECRET ? "?auth=" + SECRET : ""));
  es.addEventListener("put", e => { const m = JSON.parse(e.data); applyChange(m.path, m.data, false); load(); });
  es.addEventListener("patch", e => { const m = JSON.parse(e.data); applyChange(m.path, m.data, true); load(); });
}
function disconnect() { if (es) { es.close(); es = null; } }
document.addEventListener("visibilitychange", () => {
  if (!unlocked) return;
  if (document.visibilityState === "visible") { connect(); load(); } else disconnect();
});

const onIsland = (la, lo) => la > 9.64 && la < 9.83 && lo > 99.93 && lo < 100.12;
function zoneOf(lat, lon) {
  const z = nearestZone(lat, lon);
  return z ? z.name : "นอกโซนที่กำหนด";
}

async function load() {
  if (!unlocked) return;
  const st = document.getElementById("status");
  try {
    const data = store;
    layer.clearLayers();
    let nf = 0, nb = 0; const pts = [];
    ZONES.forEach(z => { z.f = 0; z.b = 0; });
    const now = Date.now();
    for (const id in data) {
      const d = data[id];
      if (!d || typeof d.lat !== "number" || typeof d.lon !== "number" || !onIsland(d.lat, d.lon)) continue;
      let ts = Number(d.ts); if (ts < 1e12) ts *= 1000;
      if (!ts || now - ts > OFFLINE_MS) continue;
      const busy = d.status === "busy";
      busy ? nb++ : nf++;
      const zz = nearestZone(d.lat, d.lon);
      if (zz) zz[busy ? "b" : "f"]++;
    }
    for (const z of ZONES) {
      if (z.f + z.b === 0) continue;
      L.marker([z.lat, z.lon], {icon: L.divIcon({className: "", iconSize: [0, 0], html:
        `<div class="zone"><div class="zn">${z.name}</div><span class="g">ว่าง ${z.f}</span><span class="o">รับงาน ${z.b}</span></div>`})}).addTo(layer);
    }
    document.getElementById("nf").textContent = nf;
    document.getElementById("nb").textContent = nb;
    if (!fitted && pts.length) { map.fitBounds(pts, {padding: [60, 60], maxZoom: 14}); fitted = true; }
    st.textContent = "อัปเดต " + new Date().toLocaleTimeString("th-TH");
  } catch (e) {
    st.textContent = "โหลดไม่ได้ ตรวจสอบ DB_URL";
  }
}
setInterval(load, 5000);

let meDot = null;
function setMeDot(lat, lon) {
  if (!meDot) meDot = L.circleMarker([lat, lon], {radius: 8, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1, interactive: false}).addTo(map);
  else meDot.setLatLng([lat, lon]);
}

function unlock(p) {
  const lat = p.coords.latitude, lon = p.coords.longitude;
  setMeDot(lat, lon);
  unlocked = true;
  document.getElementById("gate").style.display = "none";
  const me = document.getElementById("me");
  me.style.display = "block";
  me.textContent = "คุณอยู่โซน: " + zoneOf(lat, lon) + "  (±" + Math.round(p.coords.accuracy) + " ม.  " + lat.toFixed(4) + ", " + lon.toFixed(4) + ")";
  connect(); load();
  navigator.geolocation.watchPosition(q => {
    if (q.coords.accuracy > 500) return;
    const qlat = q.coords.latitude, qlon = q.coords.longitude;
    setMeDot(qlat, qlon);
    me.textContent = "คุณอยู่โซน: " + zoneOf(qlat, qlon) + "  (±" + Math.round(q.coords.accuracy) + " ม.  " + qlat.toFixed(4) + ", " + qlon.toFixed(4) + ")";
  }, () => {}, {enableHighAccuracy: true, maximumAge: 15000});
}

document.getElementById("gobtn").onclick = () => {
  const err = document.getElementById("gerr"); err.textContent = "";
  if (!navigator.geolocation) { err.textContent = "เครื่องนี้ไม่รองรับการแชร์ตำแหน่ง"; return; }
  navigator.geolocation.getCurrentPosition(unlock,
    () => { err.textContent = "ต้องอนุญาตตำแหน่งจึงจะเข้าดูได้ ตรวจสอบการตั้งค่าเบราว์เซอร์แล้วลองใหม่"; },
    {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
};
try { navigator.wakeLock.request("screen"); } catch (e) {}
</script>
</body>
</html>
